[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slipstream-accel"
version = "0.1.0"
description = "Native accelerator beam-dynamics and tracking tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "h5py>=3.8",
    "numpy>=1.24",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "scipy>=1.10",
    "torch>=2.0",
]

[project.urls]
Repository = "https://github.com/astec-stfc/slipstream"
Documentation = "https://github.com/astec-stfc/slipstream/blob/main/docs/README.md"

[project.optional-dependencies]
sdds = ["soliday.sdds"]
cuda = ["warp-lang"]
optimise = ["cma>=4"]
plot = ["matplotlib>=3.6"]

[project.scripts]
slipstream-beamline = "slipstream.beamline_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Explicit rules keep new Ruff releases from changing what CI enforces.
select = ["E4", "E7", "E9", "F"]
ignore = ["E731"]
