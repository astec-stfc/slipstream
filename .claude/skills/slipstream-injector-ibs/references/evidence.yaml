- id: mixed-compiled-pusher
  kind: backend
  required: false
  command:
  - python
  - -c
  - "import runpy\nfrom pathlib import Path\nimport torch\nimport warp as wp\nwp.config.kernel_cache_dir\
    \ = str(Path('.tmp-injector-ibs-warp-cache').resolve())\ntests = runpy.run_path('slipstream/tests/test_injector_ibs.py')\n\
    directory = Path('.tmp-injector-ibs-mixed-check').resolve()\ndirectory.mkdir(exist_ok=True)\nmachine\
    \ = tests['make_machine'](directory)\nmachine.ibs = tests['settings'](coulomb_log=7., seed=2)\nargs\
    \ = dict(device='cuda', dtype=torch.float64, verbose=False, return_particles=True)\neager = machine.track(use_compile=False,\
    \ **args)\ncompiled = machine.track(use_compile=True, **args)\nfor key in ('x', 'y', 'z', 'ux', 'uy',\
    \ 'uz'):\n    torch.testing.assert_close(eager[key], compiled[key], rtol=1e-12, atol=1e-14)\n    print(key,\
    \ float((eager[key]-compiled[key]).abs().max()))\n"
  cwd: parent checkout
  input_identity: Small 52-step CUDA machine; seed 2, log 7, cells (1e-4,2e-4,3e-4) m; same eager collision
    operator in both runs.
  expected: Eager versus existing compiled/Warp field pushing agree at roundoff.
  measured: Maximum position difference 2.710505431213761e-20 m; proper velocities identical; 1248 collision
    pairs each.
  status: pass
  artifacts:
  - .tmp-injector-ibs-artifacts/compiled-parity.json
