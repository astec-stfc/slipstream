    seed; persistent regressions also cover parameter underflow.
  expected: 0.0
  measured: -0.0001583291845088415
  tolerance:
    rtol: 0.0
    atol: 0.010955
    rationale: Six standard errors for the isotropic mean with 100000 independent samples (variance 1/3).
  status: pass
  artifacts:
  - .tmp-injector-ibs-forward/check.py
  - .tmp-injector-ibs-forward/check.json
  additional_result: Second moment 0.33336143032496723, target 1/3; no deterministic backscatter at parameter
