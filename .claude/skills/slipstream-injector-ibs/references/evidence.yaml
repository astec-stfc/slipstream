limitations:
- Base revisions predate the implementation; working-tree source hashes accompany this record.
- No full-machine cell/particle/time/space-charge convergence, matched external-reference comparison or
  performance target is claimed.
- Strong coupling, cathode DIH, quantum/degenerate physics, unequal weights and relativistic thermal rates
  are outside the model.
- Float32 and differentiable tracking are rejected; collisions run eagerly even when field pushing is
  compiled.
- CPU/CUDA seeded replay is local to the tested environment; no cross-device RNG equivalence is claimed.
- Optional legacy workbench fixture failure is retained separately; the entire parent-workbench suite
  was not certified.
- Temporary artifacts are local and regenerable; portable scientific tests and derivations remain in the
  package.
- Original TA/Nanbu bibliographic records were verified, but their paywalled full texts were not used
  as read evidence.
next_action: Select matched real-machine inputs and run the remaining convergence/reference study gates
  in IBS_INJECTOR_PLAN.md; rerun operator checks after source changes.
