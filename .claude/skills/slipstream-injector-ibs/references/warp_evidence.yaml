limitations:
- Physics limits and original independent oracles remain in evidence.yaml; this update preserves that
  model.
- No strong coupling, cathode DIH, quantum corrections, unequal weights, relativistic thermal rates or
  float32 support.
- The Warp pair path is forward-only and rejects gradient-bearing inputs. CUDA graph capture of IBS is
  not implemented.
- Seeded replay is exact within a backend/environment; cross-backend arithmetic is compared to float64
  tolerance, not bitwise equality.
- Warm timing depends on scattering strengths and hardware. Nanbu calls entering the 48-iteration inversion
  cost more on the reference path; 10k timing samples show this variation.
- Whole-collision benchmark includes grouping, RNG, interop and validation. Memory metric covers Torch
  allocator only; first-call times can include cached loading and are not independent fresh-cache build
  times.
- CLARA performance run covers only the first 3mm with 1024 particles and a 16x32 field mesh. It is not
  a converged full-lattice or external-reference study.
- The default ASTRA 5pC input deck and automatic generator file are absent. The existing 20pC YAML and
  stored distribution were used.
- The previously missing legacy workbench fixture remains outside this change; nine portable affected
  workbench checks passed.
- Original evidence records earlier source hashes and results. This record pins the acceleration update;
  temporary artifacts remain local.
next_action: Use CLARA --ibs-comparison with explicit cells/cutoffs; establish full-lattice particle/cell/time/space-charge
  convergence and a matched reference plane before interpreting quantitative IBS predictions.
